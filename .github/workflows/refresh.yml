name: Rafraichir les donnees

# La page lit les Google Sheets en direct dans le navigateur. Ce job sert a :
# 1. rafraichir la copie de secours (data/eod.csv, data/tally.csv)
# 2. recuperer les soumissions Tally PARTIELLES (data/partielles.csv) : Tally ne
#    les envoie jamais au Sheet, seule l'API les expose -> la page les lit ici.
# D'ou le passage a un rythme horaire en journee.
on:
  schedule:
    - cron: "15 5-20 * * *"   # toutes les heures, ~7h15 -> ~22h15 Paris (ete)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Telecharger les CSV
        env:
          TALLY_API_KEY: ${{ secrets.TALLY_API_KEY }}
        run: python3 build.py --data-only

      - name: Commiter si ca a change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "aucun changement"
          else
            git commit -m "donnees du $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
